[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "filewise-engine"
version = "0.1.0"
description = "Filewise: evidence-bound enterprise knowledge computing and release control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
retrieval = ["fastembed>=0.8,<0.9"]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1,<2"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "httpx>=0.28,<1"]

[project.scripts]
filewise = "filewise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filewise"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/pyproject.toml", "/uv.lock", "/Dockerfile", "/.dockerignore", "/.github", "/.gitignore"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
