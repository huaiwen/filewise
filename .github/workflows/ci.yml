name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go mod verify
      - run: make check
      - run: make build
      - run: build/filewise --version
      - run: FILEWISE_TEST_BINARY="$PWD/build/filewise" npm test
      - run: bash tests/install.sh "$PWD/build/filewise"
      - name: Cross-build without C or other language runtimes
        shell: bash
        run: |
          for os in darwin linux; do
            for arch in arm64 amd64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "build/filewise-$os-$arch" ./cmd/filewise
            done
          done
