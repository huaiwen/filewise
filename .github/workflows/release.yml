name: Go native binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-binaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native target
        env:
          EXPECT_OS: ${{ matrix.goos }}
          EXPECT_ARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$EXPECT_OS"
          test "$(go env GOARCH)" = "$EXPECT_ARCH"
          go mod verify
      - run: make check
      - run: make build
      - name: Verify release identity
        run: |
          version=$(build/filewise --version | awk '{print $2}')
          test "$(build/filewise --version)" = "filewise $version (Go)"
          test "$(node -p 'require("./package.json").filewise.nativeVersion')" = "v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - run: FILEWISE_TEST_BINARY="$PWD/build/filewise" npm test
      - name: Test real binary installation with offline download fixtures
        run: bash tests/install.sh "$PWD/build/filewise"
      - name: Package Go binary and checksum
        env:
          TARGET: ${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          mkdir release
          asset="filewise-$TARGET.tar.gz"
          tar -czf "release/$asset" -C build filewise
          cd release
          shasum -a 256 "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: filewise-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            release/filewise-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            release/filewise-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error
  publish:
    # A separately authorized, matching new tag opts into publication. Existing tags/assets are immutable.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'huaiwen/filewise'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: filewise-*
          path: release
          merge-multiple: true
      - name: Publish after all four native builds and installation gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(find release -type f | wc -l)" -eq 8
          (cd release && sha256sum --check ./*.sha256)
          cp install.sh release/install.sh
          (cd release && sha256sum install.sh > install.sh.sha256)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft \
            --title "Filewise $GITHUB_REF_NAME (Go)" --generate-notes \
            --notes 'Go development preview for macOS/Linux, ARM64/x86-64. No compiler, Python or Node runtime required. Separate Go state: legacy databases are not converted. Stop all instances before replacement. macOS binaries are not Apple-notarized. See docs/install.md and filewise --licenses.'
          flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "${flags[@]}"
